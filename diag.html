<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinlink diagnostics</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.45 ui-monospace, Menlo, monospace; }
  body { max-width: 56rem; margin: 1rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 5rem; box-sizing: border-box; margin-bottom: .5rem; }
  pre, .row { white-space: pre-wrap; word-break: break-all; margin: 0; }
  button, select { font: inherit; margin: 0 .25rem .25rem 0; }
  .ok { color: #1a7f37; }
  .bad { color: #cf222e; }
</style>

<p><a href=index.html>Back to app</a> | add <code>?auto</code> to run probes on load</p>
<h3>Probes</h3>
<button id=run>Run probes</button><button id=copy>Copy JSON</button>
<div id=probes></div>

<h3>P2P echo / throughput</h3>
<select id=mode>
  <option value=bc>auto: BroadcastChannel (open 2 tabs)</option>
  <option value=manual>manual: copy/paste SDP</option>
  <option value=mqtt>mqtt: sealed via public broker (share URL incl. #secret)</option>
</select>
<button id=offer>Offer</button><button id=apply>Apply input</button>
<button id=ping>Ping x20</button><button id=blast>Blast 64 MiB</button>
<label><input type=checkbox id=soak> soak (1 Hz)</label>
<textarea id=out readonly placeholder="local SDP (manual mode)"></textarea>
<textarea id=in placeholder="remote SDP (manual mode)"></textarea>
<pre id=log></pre>

<script type=module src=diag-app.js></script>
